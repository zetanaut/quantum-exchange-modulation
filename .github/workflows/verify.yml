name: Verify quantum implementation
on:
  push:
    branches: [main]
    paths: ['qem/**', 'scripts/**', 'examples/**', 'verification/**', 'results/submission_revision/**', 'paper/qip/**', 'requirements.txt', '.github/workflows/verify.yml']
  pull_request:
    paths: ['qem/**', 'scripts/**', 'examples/**', 'verification/**', 'results/submission_revision/**', 'paper/qip/**', 'requirements.txt', '.github/workflows/verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recorded CPU environment
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Mathematical and actual-QNode verification
        run: python scripts/run_all.py
      - name: User-facing forward and checkpoint example
        run: |
          python examples/layer_forward.py
          python examples/pretrained_inference.py
          python examples/qip_revision_inference.py --output /tmp/qem-ci-qip-inference
          python examples/train_streaming.py --steps 2 --output /tmp/qem-ci-streaming
      - name: Independent physics examples
        run: |
          python examples/physics_examples.py --output /tmp/qem-ci-physics
          python scripts/physics_application_diagnostics.py --output /tmp/qem-ci-physics-applications
      - name: QIP revision record and transfer checks
        run: |
          python scripts/submission_validate_datasets.py
          python scripts/submission_validate_checkpoints.py
          python scripts/submission_generic_checks.py
          python scripts/submission_reviewer_diagnostics.py
          python scripts/submission_transfer_refresh.py
          python scripts/submission_break_even.py
          python scripts/submission_release_gate.py
          python scripts/verify_qip_paper_sources.py
