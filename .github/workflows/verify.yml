name: Verify quantum implementation
on:
  push:
    branches: [main]
    paths: ['qem/**', 'scripts/**', 'examples/**', 'verification/**', 'requirements.txt', '.github/workflows/verify.yml']
  pull_request:
    paths: ['qem/**', 'scripts/**', 'examples/**', 'verification/**', 'requirements.txt', '.github/workflows/verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recorded CPU environment
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Mathematical and actual-QNode verification
        run: python scripts/run_all.py
      - name: User-facing forward and checkpoint example
        run: |
          python examples/layer_forward.py
          python examples/pretrained_inference.py
          python examples/train_streaming.py --steps 2 --output /tmp/qem-ci-streaming
      - name: Independent physics examples
        run: python examples/physics_examples.py --output /tmp/qem-ci-physics
